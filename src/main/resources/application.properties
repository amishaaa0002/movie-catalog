spring.application.name=movie-catalog

app.name=movie_catalog
app.version=1.0

catalog.max-genres-per-movie=3
catalog.default-rating=7.0

# H2 Database
spring.datasource.url=jdbc:h2:mem:moviedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update tables
spring.jpa.hibernate.ddl-auto=update

# Keep lazy loading inside service transactions
spring.jpa.open-in-view=false

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL parameter values
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Load a movie's genres in batches when listing (avoids N+1 queries)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Pagination guard rail
spring.data.web.pageable.max-page-size=100

# OpenAPI / Swagger UI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

